<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="2ndMind">
  <title>2ndMind</title>
  <!--
    The 2ndMind mark: a brain in the shape of the 🧠 emoji, magenta on near-black
    (V3 §0.6, D-151, brand_and_voice.md).

    Fourth drawing, and it reverses part of D-145/D-148 on purpose. Those built an anatomical
    left-facing profile: 1.65 : 1, deep Sylvian fissure, cerebellum, brain stem. The emoji is a
    different object — rounder (~1.27 : 1), no stem, no cerebellum, and its grooves *wander*
    instead of running parallel. Matching it means giving up the anatomy, which is the trade
    being made here.

    What actually makes it read as the emoji, in order of how much it buys:

    1. WAVY GROOVES. The single biggest difference. Parallel arcs read as a rib cage; the emoji's
       grooves S-bend twice on their way down and that alone reads as brain tissue.
    2. A BUMPY OUTLINE ALL ROUND. Not just across the top — the underside is lobed too, which is
       what stops it looking like a bitten circle.
    3. FEWER, HEAVIER CUTS. Six, at stroke 18, versus thirteen at 13. The previous drawing was at
       the legibility ceiling and degrading by 36px; this one has ~50 units of magenta between
       neighbours, which is about 4.5px at launcher size.

    Still a filled silhouette with the folds cut *out* in the ground colour rather than drawn as
    strokes over it: at 48px thin strokes on a dark field disappear into the background.

    Overshooting a fold past the silhouette is harmless — the cut colour and the tile colour are
    the same, so a stroke that runs off the edge simply stops being visible.
  -->
  <defs>
    <!-- userSpaceOnUse, not the default objectBoundingBox: one shape today, but the ramp should
         not silently rescale if the mark is ever split into several paths again. -->
    <linearGradient id="lobe" gradientUnits="userSpaceOnUse" x1="256" y1="102" x2="256" y2="404">
      <stop offset="0" stop-color="#f06fa8" />
      <stop offset="1" stop-color="#c53f82" />
    </linearGradient>
  </defs>

  <g id="mark">
    <!-- One closed blob, lobed the whole way round. Twelve short arcs rather than four long
         ones: each arc is one bump, and bumps on the underside matter as much as on the top. -->
    <path
      fill="url(#lobe)"
      d="M78 250
         C70 210 92 172 128 158
         C138 124 180 108 212 128
         C232 100 282 100 302 126
         C336 106 382 122 390 158
         C428 168 448 206 436 244
         C456 274 448 316 414 332
         C408 368 372 392 336 380
         C316 404 274 408 254 386
         C226 406 186 400 172 374
         C132 376 100 348 106 314
         C76 296 68 268 78 250
         Z" />

    <!-- Grooves. Each one S-bends twice on the way down; that wander is what separates a brain
         from a striped shell. Nothing sits closer than ~45 units to a neighbour, so at 48px
         there is still ~2.5px of magenta between any two cuts.

         Lengths alternate long/short. The wiggle carries the shape at full size but flattens
         out by 36px, and five verticals of equal length then read as fingers — the same trap
         D-148 hit with parallel arcs, arriving from a different direction. -->
    <g fill="none" stroke="#140a10" stroke-width="18" stroke-linecap="round">
      <path d="M126 168 C148 194 122 216 140 244 C152 262 134 270 140 280" />
      <path d="M196 140 C218 168 192 190 210 218 C226 244 202 268 214 298" />
      <path d="M268 132 C290 160 264 182 280 208 C292 228 274 240 280 254" />
      <path d="M340 142 C362 170 336 192 354 220 C370 246 346 272 358 300" />
      <path d="M408 178 C426 204 404 224 416 246" />

      <!-- The one groove that runs the other way, dividing off the lower lobe. It breaks out of
           the front edge on purpose — it is the only cut that does, which is what makes it read
           as a division rather than as a sixth fold. -->
      <path d="M96 322 C140 350 200 356 250 342 C290 330 320 340 340 358" />
    </g>
  </g>
</svg>
